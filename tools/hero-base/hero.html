<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuzMesh Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
  /* Measurements taken from the reference at a 2227 x 1417 px window. */
  :root {
    --bg: #000;
    --paper: #f5f3ed;
    --pill: #151517;
    --marker: #ffd60a;

    --container: 71.85vw;      /* 1600px at 2227px: side space stays ~14% each side */
    --gutter: 16px;            /* min side space on small screens */
    --hero-pad-bottom: 76.5px;

    --nav-top: 19px;
    --nav-left: 36px;
    --nav-w: 232px;
    --nav-h: 56px;
    --nav-radius: 8px;
    --nav-pad-x: 16px;
    --nav-open-w: 380px;
    --mist: #a1a1aa;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --logo-h: 17.8px;

    --h-size: 7.83cqw;         /* of the content width: 125px at 1600 */
    --h-leading: 0.858;
    --h-tracking: -0.015em;
    --h-weight: 900;
    --h-stretch: 86%;
    --h-gap: 20px;             /* last line to the cards */

    --card-gap: 16px;
    --card-ratio: 1.4539;
    --card-radius: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--paper); }
  body { font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Nav pill: closed it is the small bar; open it grows into the menu panel */
  .nav {
    position: fixed; z-index: 10;
    top: var(--nav-top); left: var(--nav-left);
    width: var(--nav-w);
    background: var(--pill); border-radius: var(--nav-radius);
    overflow: hidden;
    transition: width .45s var(--ease);
  }
  .nav.is-open { width: var(--nav-open-w); }
  .nav__bar {
    height: var(--nav-h); padding: 0 var(--nav-pad-x);
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav__home { display: flex; color: var(--paper); border-radius: 4px; }
  .nav__logo { height: var(--logo-h); width: auto; display: block; }
  .nav__menu {
    position: relative; width: 32px; height: 32px; margin-right: -4.25px;
    padding: 0; border: 0; border-radius: 4px; background: none; cursor: pointer;
  }
  .nav__menu span {
    position: absolute; left: 7px; width: 17.5px; height: 2px;
    background: var(--paper); border-radius: 1px;
    transition: transform .35s var(--ease);
  }
  .nav__menu span:nth-child(1) { top: 11px; }
  .nav__menu span:nth-child(2) { top: 19px; }
  .nav.is-open .nav__menu span:nth-child(1) { transform: translateY(4px) rotate(45deg); }
  .nav.is-open .nav__menu span:nth-child(2) { transform: translateY(-4px) rotate(-45deg); }
  .nav a:focus-visible, .nav button:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

  /* Menu panel: grid rows animate from 0 to the content height */
  .nav__panel {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .45s var(--ease), visibility 0s linear .45s;
    visibility: hidden;
  }
  .nav.is-open .nav__panel {
    grid-template-rows: 1fr;
    transition: grid-template-rows .45s var(--ease), visibility 0s;
    visibility: visible;
  }
  .nav__panel-inner { min-height: 0; overflow: hidden; }
  .nav__links {
    list-style: none; margin: 0; padding: 12px var(--nav-pad-x) 8px;
    border-top: 1px solid rgb(255 255 255 / .08);
  }
  .nav__links a {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 6px 0; color: var(--paper); text-decoration: none;
    font-size: 34px; font-weight: 900; font-stretch: 86%; letter-spacing: -0.02em;
    line-height: 1; text-transform: uppercase;
    opacity: 0; transform: translateY(8px);
    transition: opacity .3s, transform .3s var(--ease), color .2s;
  }
  .nav__links a small { font: 600 11px/1 'Archivo', sans-serif; letter-spacing: .04em; color: var(--mist); }
  .nav__links a:hover, .nav__links a[aria-current="page"] { color: var(--marker); }
  .nav.is-open .nav__links a { opacity: 1; transform: none; }
  .nav.is-open .nav__links li:nth-child(2) a { transition-delay: .04s; }
  .nav.is-open .nav__links li:nth-child(3) a { transition-delay: .08s; }
  .nav.is-open .nav__links li:nth-child(4) a { transition-delay: .12s; }
  .nav.is-open .nav__links li:nth-child(5) a { transition-delay: .16s; }
  .nav__foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px var(--nav-pad-x) var(--nav-pad-x);
  }
  .nav__mail { color: var(--mist); font-size: 13px; text-decoration: none; border-radius: 4px; }
  .nav__mail:hover { color: var(--paper); }
  .nav__cta {
    display: inline-flex; align-items: center; height: 36px; padding: 0 14px;
    background: var(--marker); color: #0e0e10; border-radius: 6px;
    font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap;
  }
  .nav-scrim {
    position: fixed; inset: 0; z-index: 9; background: rgb(0 0 0 / .5);
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  .nav-scrim.is-open { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) {
    .nav, .nav *, .nav-scrim { transition-duration: 0s !important; transition-delay: 0s !important; }
  }

  /* Hero */
  .hero {
    min-height: 100svh;
    display: flex; align-items: flex-end;
    padding: 0 var(--gutter) var(--hero-pad-bottom);
  }
  .hero__inner {
    container-type: inline-size;
    width: 100%; max-width: var(--container); margin: 0 auto;
  }
  .hero__headline {
    margin: 0 0 var(--h-gap);
    font-size: var(--h-size);
    font-weight: var(--h-weight);
    font-stretch: var(--h-stretch);
    line-height: var(--h-leading);
    letter-spacing: var(--h-tracking);
    text-transform: uppercase;
    margin-left: -0.032em;     /* pull the first letter's side bearing back to the edge */
  }
  .hero__headline sup { font-size: 0.44em; vertical-align: 0.9em; line-height: 0; letter-spacing: 0; margin-left: 0.08em; }
  .hero__accent { color: var(--marker); }

  .hero__cards {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--card-gap);
  }
  .hero__card a { display: block; position: relative; color: inherit; }
  .hero__card figure {
    margin: 0; overflow: hidden; border-radius: var(--card-radius);
    aspect-ratio: var(--card-ratio); background: #1c1c20;
  }
  .hero__card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .hero__card a:hover img { transform: scale(1.03); }
  /* Placeholder until a real image is set */
  .hero__card figure:not(:has(img)) { background: linear-gradient(135deg, #26262c, #121215); }
  .hero__card:nth-child(2) figure:not(:has(img)) { background: linear-gradient(135deg, #ffe45c, var(--marker)); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 767px) {
    :root { --container: 100%; --nav-top: 12px; --nav-left: 12px; --nav-w: 200px; --nav-open-w: calc(100vw - 24px); --nav-h: 48px; --logo-h: 14px; --hero-pad-bottom: 24px; --h-gap: 20px; }
    .hero__headline { font-size: 13cqw; }
    .hero__cards {
      grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 82%;
      overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
      margin-right: calc(var(--gutter) * -1); padding-right: var(--gutter);
    }
    .hero__card { scroll-snap-align: start; }
  }
</style>
</head>

<script>
  // Menu: open/close the pill, close on Escape, outside click or link click,
  // and keep keyboard focus inside the menu while it is open.
  (() => {
    const nav = document.getElementById('nav');
    const toggle = document.getElementById('navToggle');
    const panel = document.getElementById('navPanel');
    const scrim = document.getElementById('navScrim');
    const focusables = () => [toggle, ...panel.querySelectorAll('a')];

    function setOpen(open, { focus = true } = {}) {
      nav.classList.toggle('is-open', open);
      scrim.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      panel.inert = !open;
      if (!focus) return;
      if (open) panel.querySelector('a').focus({ preventScroll: true });
      else toggle.focus({ preventScroll: true });
    }

    panel.inert = true;
    toggle.addEventListener('click', () => setOpen(!nav.classList.contains('is-open')));
    scrim.addEventListener('click', () => setOpen(false));
    panel.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false, { focus: false }); });
    document.addEventListener('keydown', (e) => {
      if (!nav.classList.contains('is-open')) return;
      if (e.key === 'Escape') { setOpen(false); return; }
      if (e.key !== 'Tab') return;
      const items = focusables();
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  })();
</script>

name: Environment safeguards
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment-safeguards:
    name: Environment safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test scripts/sanity-environment.test.ts

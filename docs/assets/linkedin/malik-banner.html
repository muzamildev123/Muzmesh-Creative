<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  /* MuzMesh brand v2 tokens (docs/brand/ai/BRAND.md) */
  :root { --black:#000000; --bone:#F4F4F1; --ash:#77777C; --muted:rgba(244,244,241,.74); --graphite:#2C2C35; --signal:#F2580F; --signal-deep:#CC3D08; }
  html,body { margin:0; padding:0; background:var(--black); }
  .b { position:relative; width:1584px; height:396px; overflow:hidden; background:var(--black); color:var(--bone); font-family:'Inter Tight',sans-serif; }
  /* dotted workbench, faded toward the text */
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(244,244,241,.10) 1.6px, transparent 2px); background-size:32px 32px;
          -webkit-mask-image:linear-gradient(90deg,#000 0%, rgba(0,0,0,.5) 28%, transparent 46%); mask-image:linear-gradient(90deg,#000 0%, rgba(0,0,0,.5) 28%, transparent 46%); }
  /* copper light curtain: soft vertical streaks rising from the bottom, right side only */
  .curtain { position:absolute; left:0; right:0; bottom:0; height:100%;
    background:
      repeating-linear-gradient(90deg, rgba(204,61,8,0) 0 46px, rgba(204,61,8,.22) 70px, rgba(204,61,8,0) 96px, rgba(204,61,8,0) 150px),
      linear-gradient(0deg, rgba(204,61,8,.16), transparent 70%);
    filter:blur(18px);
    -webkit-mask-image:linear-gradient(0deg,#000 0%, rgba(0,0,0,.5) 45%, transparent 90%); mask-image:linear-gradient(0deg,#000 0%, rgba(0,0,0,.5) 45%, transparent 90%); }
  .cwrap { position:absolute; inset:-40px 0 0 0; -webkit-mask-image:linear-gradient(90deg, transparent 30%, rgba(0,0,0,.6) 55%, #000 80%); mask-image:linear-gradient(90deg, transparent 30%, rgba(0,0,0,.6) 55%, #000 80%); }
  .grain { position:absolute; inset:0; opacity:.05; mix-blend-mode:screen; }
  /* text starts 30% from the left (475px) */
  .content { position:absolute; left:500px; top:62px; right:80px; }
  .label { font-family:'JetBrains Mono',monospace; font-weight:400; font-size:22px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:14px; white-space:nowrap; }
  .label i { width:10px; height:10px; background:var(--signal); display:inline-block; }
  h1 { margin:26px 0 0; font-weight:500; font-size:72px; line-height:1.02; letter-spacing:-.035em; text-wrap:balance; }
  h1 .dim { color:var(--ash); }
  h1 .dot { color:var(--signal); }
  .stack { position:absolute; left:500px; bottom:42px; font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:.06em; text-transform:uppercase; color:var(--ash); white-space:nowrap; }
  .stack b { color:var(--graphite); font-weight:400; padding:0 8px; }
  .mark { position:absolute; right:80px; bottom:44px; width:150px; }
</style></head>
<body>
<div class="b">
  <div class="dots"></div>
  <div class="cwrap"><div class="curtain"></div></div>
  <svg class="grain" width="1584" height="396"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="content">
    <div class="label"><i></i>Creative frontend engineer · Co-founder, MuzMesh</div>
    <h1><span class="dim">Generated sites all feel the same.</span><br>I build the ones that don’t<span class="dot">.</span></h1>
  </div>

  <div class="stack">GSAP<b>/</b>Three.js<b>/</b>WebGL<b>/</b>Astro<b>/</b>Figma<b>/</b>Claude Code</div>
  <img class="mark" src="muzmesh-wordmark-light.svg" alt="muzmesh">
</div>
</body></html>
